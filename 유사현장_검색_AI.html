<style>
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --border:#e3e6eb;
  --ink:#181c25;
  --sub:#6b7280;
  --accent:#2f6feb;
  --accent-dark:#2457c2;
  --accent-soft:#eaf1ff;
  --table-head:#161b28;
  --danger:#d64545;
  --ok:#1e9e63;

*{box-sizing:border-box;}
body,html{margin:0;padding:0;}
#app{background:var(--bg);min-height:100vh;padding:28px 32px 60px;color:var(--ink);}
.wrap{max-width:1180px;margin:0 auto;}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.2px;margin-bottom:6px;}
.eyebrow .dot{width:8px;height:8px;background:var(--accent);border-radius:2px;display:inline-block;}
.title-row{display:flex;align-items:baseline;gap:6px;border-left:4px solid var(--accent);padding-left:14px;margin-bottom:22px;}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px;}
.title-sub{color:var(--sub);font-size:13px;font-weight:500;}

.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:10px 2px 12px;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;user-select:none;}
.tab.active{color:var(--accent);border-color:var(--accent);}
.tab:hover:not(.active){color:var(--ink);}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid #cddcfb;color:#1d3f8f;font-size:13px;padding:12px 14px;border-radius:8px;margin-bottom:18px;line-height:1.55;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 22px 18px;margin-bottom:18px;}
.card h3{font-size:14px;margin:0 0 16px;font-weight:700;}

.grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr;gap:14px;}
@media (max-width:1000px){.grid{grid-template-columns:1fr 1fr;}}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px;}
.field input[type=text], .field select{
  width:100%;padding:9px 11px;border:1px solid #d7dae0;border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink);
  height:38px;
}
.field input[type=text]:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
.stepper{display:flex;align-items:center;border:1px solid #d7dae0;border-radius:7px;overflow:hidden;height:38px;}
.stepper button{width:32px;height:38px;border:none;background:#f2f3f5;color:var(--ink);font-size:16px;cursor:pointer;flex:0 0 auto;}
.stepper button:hover{background:#e6e8eb;}
.stepper input{flex:1;border:none;text-align:center;font-size:13.5px;height:100%;width:100%;min-width:0;color:var(--ink);}
.stepper input:focus{outline:none;}

.actionbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;flex-wrap:wrap;gap:10px;}
.result-count{font-size:13.5px;color:var(--sub);font-weight:600;}
.result-count b{color:var(--ink);}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
button.btn{border:none;border-radius:7px;font-size:13.5px;font-weight:700;padding:9px 16px;cursor:pointer;transition:background .12s;}
button.btn.primary{background:var(--accent);color:#fff;}
button.btn.primary:hover{background:var(--accent-dark);}
button.btn.primary:disabled{background:#b9c8ea;cursor:not-allowed;}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid #d7dae0;}
button.btn.ghost:hover{background:#f2f3f5;}
button.btn.danger{background:#fff;color:var(--danger);border:1px solid #f0c4c4;}
button.btn.danger:hover{background:#fdeeee;}
button.btn.big{padding:10px 22px;font-size:14.5px;}

.tablewrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.scrollx{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:920px;}
thead th{background:var(--table-head);color:#fff;font-size:12.5px;font-weight:700;padding:12px 10px;text-align:left;white-space:nowrap;}
tbody td{padding:10px 10px;font-size:13px;border-bottom:1px solid #eef0f3;color:var(--ink);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfd;}
td.num{text-align:right;white-space:nowrap;}
td.rank{color:var(--sub);font-weight:700;text-align:center;width:44px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700;background:#eef1f5;color:#44506b;}
.empty-state{background:var(--table-head);color:#fff;text-align:center;padding:54px 20px;font-size:14px;line-height:2;}
.empty-state b{font-size:15.5px;}
.empty-state .sub{color:#9aa4bb;font-size:12.5px;}

.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.file-hint{font-size:12px;color:var(--sub);}
.upload-preview{background:#f8fafc;border:1px dashed #c7d0dd;border-radius:8px;padding:12px 14px;font-size:13px;margin-top:10px;display:none;}
.upload-preview.show{display:block;}
.upload-preview .row{display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1b2233;color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.meta-line{font-size:12.5px;color:var(--sub);margin-bottom:14px;}
input[type=file]{display:none;}

.lock-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pw-form{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #d7dae0;border-radius:8px;padding:8px 10px;}
.pw-form input{border:1px solid #d7dae0;border-radius:6px;padding:7px 10px;font-size:13px;width:140px;}
.pw-form input:focus{outline:2px solid var(--accent);border-color:var(--accent);}
.edit-cell input, .edit-cell select{width:100%;min-width:70px;padding:5px 6px;border:1px solid #d7dae0;border-radius:5px;font-size:12.5px;background:#fff;}

tr.editing td{background:#fbfcfe;}

let xlsxLoadPromise = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxLoadPromise){
    xlsxLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = ()=>resolve();
      s.onerror = ()=>{ xlsxLoadPromise=null; reject(new Error('xlsx load failed')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoadPromise;
}

function deriveRegion(name){
  const n = name||"";
  const test = (arr)=>arr.some(k=>n.includes(k));
  if(test(DAEJEON)) return "대전";
  if(test(GWANGJU)) return "광주";
  if(test(DAEGU)) return "대구";
  if(test(BUSAN)) return "부산";
  if(test(ULSAN)) return "울산";
  if(test(JEJU)) return "제주도";
  if(test(GEOJE)) return "거제도";
  if(test(INCHEON)) return "인천";
  if(test(GG_NORTH)) return "경기북부";
  if(test(GG_SOUTH)) return "경기남부";
  if(test(GANGWON)) return "강원도";
  if(test(CHUNGCHEONG)) return "충청도";
  if(test(GYEONGSANG)) return "경상도";
  if(test(JEOLLA)) return "전라도";
  if(test(SEOUL_GU)) return "서울";
  return "";
}
function deriveCategory(type, name){
  const n = name||"";
  if(type && BUILDING_CATEGORIES.includes(type) && type!=="미선택") return type;
  if(n.includes("리모델링")) return "리모델링";
  if(n.includes("데이터센터")||n.includes("데이터 센터")) return "데이터센터";
  if(type==="하이테크") return "데이터센터";
  if(type==="오피스텔") return "오피스텔";
  if(type==="주상복합") return "주상복합";
  if(type==="공동주택") return "공동주택";
  if(type==="일반건축물"){
    if(n.includes("기숙사")||n.includes("레지던스")) return "기타";
    return "오피스";
  }
  if(n.includes("아파트")||n.includes("주택")||n.includes("재건축")||n.includes("재개발")||n.includes("공동주택")) return "공동주택";
  if(n.includes("주상복합")) return "주상복합";
  return "기타";
}

  const areaM2 = (area===null||area===undefined||area==="") ? null : Number(area);
  const areaPyeong = areaM2===null ? null : Math.round(areaM2/PYEONG);
  return {
    division: division||"", name: name||"", block: block||"", code: code||"",
    area: areaPyeong,
    apt: (apt===null||apt===undefined||apt==="")?null:Number(apt),
    officetel: (officetel===null||officetel===undefined||officetel==="")?null:Number(officetel),
    floorB: floorB||"", floorG: floorG||"",
    date: date||"", type: type||"", note: note||"",
    category: deriveCategory(type,name),
    region: deriveRegion(name),
  };
}

/* ---------------- 저장소 (window.storage 우선, 사용 불가 시 localStorage로 자동 전환) ---------------- */
const STORAGE_TIMEOUT_MS = 8000;   // 최초 불러오기용 (느린 응답을 '데이터 없음'으로 오해하지 않도록 넉넉히)
const SAVE_TIMEOUT_MS = 15000;     // 저장용 (끊기지 않고 끝까지 기다림)
const REMOTE_STORAGE_OK = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';

function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const timer = setTimeout(()=>reject(new Error('storage-timeout')), ms);
    Promise.resolve(promise).then(v=>{ clearTimeout(timer); resolve(v); }, e=>{ clearTimeout(timer); reject(e); });
  });
}

// 반환: {status:'found', value} | {status:'empty'} | {status:'error'}
// 핵심: 응답 지연/오류('error')와 '진짜로 데이터가 없음'('empty')을 반드시 구분한다.
async function storageGet(key){
  let localRaw = null;
  try{ localRaw = localStorage.getItem(key); }catch(e){ localRaw = null; }

  if(REMOTE_STORAGE_OK){
    try{
      const res = await withTimeout(window.storage.get(key, false), STORAGE_TIMEOUT_MS);
      if(res && res.value!=null && res.value!=='') return {status:'found', value:res.value};
      // 원격은 정상 응답했지만 키가 없음 -> 혹시 로컬에 있으면 그것을 사용
      if(localRaw!==null) return {status:'found', value:localRaw};
      return {status:'empty'};
    }catch(e){
      // 원격 실패/지연 -> 로컬 백업이 있으면 사용, 없으면 '오류'로 처리(절대 empty로 취급하지 않음)
      if(localRaw!==null) return {status:'found', value:localRaw};
      return {status:'error'};
    }
  }
  if(localRaw!==null) return {status:'found', value:localRaw};
  return {status:'empty'};
}

async function storageSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ /* 용량 초과 등은 무시 */ }
  if(REMOTE_STORAGE_OK){
    await withTimeout(window.storage.set(key, value, false), SAVE_TIMEOUT_MS);
  }
  return true;
}

async function loadBaseline(){
  const res = await storageGet('baseline_sites');

  if(res.status === 'found'){
    try{
      baseline = JSON.parse(res.value);
      baselineIsFallback = false;
      if(baseline.unit !== 'pyeong'){
        // 예전에 ㎡ 단위로 저장된 기준파일 -> 평 단위로 1회 자동 변환
        baseline.rows = (baseline.rows||[]).map(r=>({
          ...r,
          area: (r.area===null||r.area===undefined) ? null : Math.round(Number(r.area)/PYEONG)
        }));
        baseline.unit = 'pyeong';
        baseline.updatedAt = new Date().toISOString();
        saveBaseline().catch(()=>{});
      }
      return;
    }catch(e){ /* 저장된 값이 깨져 있으면 아래 오류 처리로 */ }
    // 파싱 실패 -> 데이터를 덮어쓰지 않고 임시 기본값만 메모리에 표시
    baseline = {updatedAt: new Date().toISOString(), unit:'pyeong', rows: DEFAULT_DATA};
    baselineIsFallback = true;
    return;
  }

  if(res.status === 'empty'){
    // 진짜로 저장된 데이터가 없을 때만 기본값을 저장한다 (덮어쓸 데이터가 없으므로 안전)
    baseline = {updatedAt: new Date().toISOString(), unit:'pyeong', rows: DEFAULT_DATA};
    baselineIsFallback = false;
    saveBaseline().catch(()=>{});
    return;
  }

  // status === 'error' : 응답 지연·오류 등 -> 기본값은 '화면 표시용'으로만 쓰고 절대 저장하지 않는다.
  // (이렇게 해야 잠깐의 읽기 실패가 저장된 기준파일을 기본값으로 덮어써 날려버리는 사고를 막는다)
  baseline = {updatedAt: new Date().toISOString(), unit:'pyeong', rows: DEFAULT_DATA};
  baselineIsFallback = true;
}
// 성공하면 true, 실패하면 false를 반환한다 (호출부에서 실패 시 재시도할 수 있도록)
async function saveBaseline(){
  let ok = true;
  try{
    await storageSet('baseline_sites', JSON.stringify(baseline));
  }catch(e){
    console.error('저장 실패', e);
    ok = false;
  }
  if(connectedFileHandle){
    const fileOk = await writeToConnectedFile();
    if(!fileOk) ok = false;
  }
  return ok;
}

/* ---------------- 공유 파일 연결 (File System Access API) ---------------- */
async function connectExistingFile(){
  if(!FS_ACCESS_OK){ showToast('이 브라우저에서는 파일 연결 기능을 지원하지 않아요. 최신 Chrome/Edge를 사용해주세요.'); return; }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON 기준파일', accept: {'application/json': ['.json']} }]
    });
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ showToast('파일 접근 권한이 필요합니다.'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      try{
        const parsed = JSON.parse(text);
        baseline = parsed;
        if(baseline.unit !== 'pyeong'){
          baseline.rows = (baseline.rows||[]).map(r=>({...r, area: (r.area===null||r.area===undefined)?null:Math.round(Number(r.area)/PYEONG)}));
          baseline.unit = 'pyeong';
        }
      }catch(e){ showToast('파일 내용을 읽을 수 없습니다. 형식을 확인해주세요.'); return; }
    }
    connectedFileHandle = handle;
    connectedFileName = handle.name;
    showToast(`"${connectedFileName}" 파일에 연결했습니다.`);
    renderBaselineTab();
  }catch(e){
    if(e.name !== 'AbortError') showToast('파일을 여는 중 오류가 발생했습니다.');
  }
}

async function createNewSharedFile(){
  if(!FS_ACCESS_OK){ showToast('이 브라우저에서는 파일 연결 기능을 지원하지 않아요. 최신 Chrome/Edge를 사용해주세요.'); return; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: '기준파일.json',
      types: [{ description: 'JSON 기준파일', accept: {'application/json': ['.json']} }]
    });
    connectedFileHandle = handle;
    connectedFileName = handle.name;
    const ok = await writeToConnectedFile();
    if(ok) showToast(`"${connectedFileName}" 파일을 새로 만들어 연결했습니다.`);
    renderBaselineTab();
  }catch(e){
    if(e.name !== 'AbortError') showToast('파일을 만드는 중 오류가 발생했습니다.');
  }
}

async function writeToConnectedFile(){
  if(!connectedFileHandle) return false;
  try{
    const perm = await connectedFileHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ showToast('파일 쓰기 권한이 거부되었습니다.'); return false; }
    const writable = await connectedFileHandle.createWritable();
    await writable.write(JSON.stringify(baseline));
    await writable.close();
    return true;
  }catch(e){
    console.error(e);
    showToast('연결된 파일에 저장하지 못했습니다.');
    return false;
  }
}

async function refreshFromConnectedFile(){
  if(!connectedFileHandle){ showToast('연결된 공유 파일이 없습니다.'); return; }
  try{
    const perm = await connectedFileHandle.requestPermission({mode:'read'});
    if(perm !== 'granted'){ showToast('파일 읽기 권한이 필요합니다.'); return; }
    const file = await connectedFileHandle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      baseline = JSON.parse(text);
      showToast('연결된 파일에서 최신 내용을 불러왔습니다.');
      renderBaselineTab();
    }
  }catch(e){
    showToast('파일을 다시 읽는 중 오류가 발생했습니다.');
  }
}

function disconnectFile(){
  connectedFileHandle = null;
  connectedFileName = "";
  showToast('공유 파일 연결을 해제했습니다.');
  renderBaselineTab();
}

/* ---------------- 유틸 ---------------- */
function fmtNum(n){ return n===null||n===undefined ? null : Number(n).toLocaleString('ko-KR'); }
function toPyeong(m2){ return m2===null||m2===undefined ? null : m2/PYEONG; }
function areaDisplay(areaPyeong){
  if(areaPyeong===null||areaPyeong===undefined) return "-";
  return `${fmtNum(areaPyeong)}평`;
}
function unitsDisplay(row){
  const parts=[];
  if(row.apt!==null) parts.push(`아파트 ${fmtNum(row.apt)}세대`);
  if(row.officetel!==null) parts.push(`오피스텔 ${fmtNum(row.officetel)}세대`);
  return parts.length? parts.join(' / ') : "-";
}
function floorDisplay(row){
  if(!row.floorB && !row.floorG) return "-";
  const b = row.floorB? `지하${row.floorB}층` : "";
  const g = row.floorG? `지상${row.floorG}층` : "";
  return [b,g].filter(Boolean).join(" ~ ");
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return (s===null||s===undefined)?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function runSearch(){
  filters.name = document.getElementById('f-name').value.trim();
  filters.cat = document.getElementById('f-cat').value;
  filters.areaLabel = document.getElementById('f-area').value;
  filters.apt = document.getElementById('f-apt').value.trim();
  filters.off = document.getElementById('f-off').value.trim();
  filters.region = document.getElementById('f-region').value;
  filters.completionYear = document.getElementById('f-year').value;

  const name = filters.name.toLowerCase();
  const cat = filters.cat;
  const areaLabel = filters.areaLabel;
  const aptRaw = filters.apt;
  const offRaw = filters.off;
  const region = filters.region;
  const completionYear = filters.completionYear;
  const aptVal = aptRaw===""? null : Number(aptRaw);
  const offVal = offRaw===""? null : Number(offRaw);
  const areaRange = AREA_RANGES.find(a=>a.label===areaLabel);

  let rows = baseline.rows.slice();

  if(name) rows = rows.filter(r => r.name.toLowerCase().includes(name));
  if(cat && cat!=="미선택") rows = rows.filter(r => r.category === cat);
  if(region && region!=="미선택") rows = rows.filter(r => r.region === region);
  if(completionYear && completionYear!=="미선택"){
    rows = rows.filter(r => r.date && r.date.slice(0,4) === completionYear);
  }
  if(areaRange && areaRange.min!==null){
    rows = rows.filter(r => {
      if(r.area===null) return false;
      return r.area >= areaRange.min && r.area <= areaRange.max;
    });
  }

  if(aptVal!==null || offVal!==null){
    rows = rows.map(r=>{
      let score = 0;
      if(aptVal!==null) score += (r.apt===null) ? 1e6 : Math.abs(r.apt - aptVal);
      if(offVal!==null) score += (r.officetel===null) ? 1e6 : Math.abs(r.officetel - offVal);
      return {row:r, score};
    }).sort((a,b)=>a.score-b.score).map(x=>x.row);
  }

  searchResults = rows;
  renderSearchTab();
}

        </div>
        ${connectedFileHandle ? `
          <div class="lock-row">
            <span class="badge" style="background:#e7f6ec;color:#1e9e63;">🔗 연결됨: ${esc(connectedFileName)}</span>
            <button class="btn ghost" id="btn-file-refresh" style="padding:6px 12px;font-size:12.5px;">↻ 파일에서 새로고침</button>
            <button class="btn danger" id="btn-file-disconnect" style="padding:6px 12px;font-size:12.5px;">연결 해제</button>

        ` : `
          <div class="lock-row">
            <button class="btn ghost" id="btn-file-open">기존 공유 파일 열기</button>
            <button class="btn ghost" id="btn-file-new">새 공유 파일 만들기</button>
            ${!FS_ACCESS_OK ? '<span class="file-hint" style="color:var(--danger);">이 브라우저/환경에서는 지원되지 않아요.</span>' : ''}
          </div>
        `}
      </div>
    </div>
    <div class="tablewrap">
      <div class="scrollx" style="max-height:520px;overflow-y:auto;">
      <table>
        <thead><tr>
          <th>사업단</th><th>현장명</th><th>블록</th><th>현장코드</th><th>연면적(평)</th><th>아파트</th><th>오피스텔</th><th>지하</th><th>지상</th><th>준공일자</th><th>건축물유형</th><th>비고</th>${editMode?'<th>삭제</th>':''}
        </tr></thead>
        <tbody id="baseline-body"></tbody>

      </div>
      ${editMode ? `

function renderReadOnlyBody(rows){
  const tbody = document.getElementById('baseline-body');
  tbody.innerHTML = rows.map(r=>`<tr>
    <td>${esc(r.division)}</td>
    <td><span class="name-cell" title="클릭하여 펼치기/접기">${esc(r.name)}</span></td>
    <td>${esc(r.block)}</td>
    <td>${esc(r.code)}</td>
    <td class="num">${r.area===null?'-':fmtNum(r.area)}</td>
    <td class="num">${r.apt===null?'-':fmtNum(r.apt)}</td>
    <td class="num">${r.officetel===null?'-':fmtNum(r.officetel)}</td>
    <td class="num">${esc(r.floorB)||'-'}</td>
    <td class="num">${esc(r.floorG)||'-'}</td>
    <td>${esc(r.date)||'-'}</td>
    <td>${r.category?`<span class="badge">${esc(r.category)}</span>`:'-'}</td>
    <td>${esc(r.note)||'-'}</td>
  </tr>`).join('');

  tbody.querySelectorAll('.name-cell').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('expanded'));
  });
}

function tryPassword(){
  const val = document.getElementById('pw-input').value;
  if(val === EDIT_PASSWORD){
    editUnlocked = true;
    editMode = true;
    showPwForm = false;
    editRows = baseline.rows.map(r=>({...r}));
    renderBaselineTab();
  }else{
    showToast('비밀번호가 올바르지 않습니다.');
  }
}

function tryUploadPassword(){
  const val = document.getElementById('upload-pw-input').value;
  if(val === EDIT_PASSWORD){
    showUploadPwForm = false;
    renderBaselineTab();
    setTimeout(()=>{ const fi = document.getElementById('file-input'); if(fi) fi.click(); }, 0);
  }else{
    showToast('비밀번호가 올바르지 않습니다.');
  }
}

function fieldInput(idx, field, value, type){
  const v = value===null||value===undefined ? "" : value;
  if(field==='type'){
    const opts = BUILDING_CATEGORIES.filter(o=>o!=="미선택");
    return `<select class="edit-cell-input" data-idx="${idx}" data-field="type">
      <option value="" ${v===""?'selected':''}>(미지정)</option>
      ${opts.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}
    </select>`;
  }
  const inputmode = type==='num' ? 'numeric' : 'text';
  return `<input class="edit-cell-input" data-idx="${idx}" data-field="${field}" type="text" inputmode="${inputmode}" value="${esc(v)}">`;
}

function renderEditableBody(){
  const tbody = document.getElementById('baseline-body');
  tbody.innerHTML = editRows.map((r,idx)=>`<tr class="editing">
    <td class="edit-cell">${fieldInput(idx,'division',r.division)}</td>
    <td class="edit-cell">${fieldInput(idx,'name',r.name)}</td>
    <td class="edit-cell">${fieldInput(idx,'block',r.block)}</td>
    <td class="edit-cell">${fieldInput(idx,'code',r.code)}</td>
    <td class="edit-cell">${fieldInput(idx,'area',r.area,'num')}</td>
    <td class="edit-cell">${fieldInput(idx,'apt',r.apt,'num')}</td>
    <td class="edit-cell">${fieldInput(idx,'officetel',r.officetel,'num')}</td>
    <td class="edit-cell">${fieldInput(idx,'floorB',r.floorB)}</td>
    <td class="edit-cell">${fieldInput(idx,'floorG',r.floorG)}</td>
    <td class="edit-cell">${fieldInput(idx,'date',r.date)}</td>
    <td class="edit-cell">${fieldInput(idx,'type',r.category)}</td>
    <td class="edit-cell">${fieldInput(idx,'note',r.note)}</td>
    <td class="edit-cell"><button class="btn danger" data-delidx="${idx}" style="padding:5px 10px;">삭제</button></td>
  </tr>`).join('');

  tbody.querySelectorAll('.edit-cell-input').forEach(el=>{
    el.addEventListener('input', ()=>{
      const idx = Number(el.dataset.idx), field = el.dataset.field;
      editRows[idx][field] = el.value;
    });
    el.addEventListener('change', ()=>{
      const idx = Number(el.dataset.idx), field = el.dataset.field;
      editRows[idx][field] = el.value;
    });
  });
  tbody.querySelectorAll('[data-delidx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.delidx);
      editRows.splice(idx,1);
      renderEditableBody();
    });
  });
}

function addBlankEditRow(){
  editRows.push({division:"",name:"",block:"",code:"",area:null,apt:null,officetel:null,floorB:"",floorG:"",date:"",type:"",note:"",category:"",region:""});
  renderEditableBody();
}

function cancelEdit(){
  editMode = false;
  editUnlocked = false;
  editRows = null;
  renderBaselineTab();
}

async function saveEdit(){
  const cleaned = editRows
    .filter(r => (r.name||"").toString().trim() !== "")
    .map(r=>{
      const area = r.area===""||r.area===null||r.area===undefined ? null : Number(r.area);
      const apt = r.apt===""||r.apt===null||r.apt===undefined ? null : Number(r.apt);
      const officetel = r.officetel===""||r.officetel===null||r.officetel===undefined ? null : Number(r.officetel);
      const name = (r.name||"").toString().trim();
      const type = (r.type||"").toString().trim();
      return {
        division: (r.division||"").toString().trim(),
        name,
        block: (r.block||"").toString().trim(),
        code: (r.code||"").toString().trim(),
        area: (area!==null && isNaN(area)) ? null : area,
        apt: (apt!==null && isNaN(apt)) ? null : apt,
        officetel: (officetel!==null && isNaN(officetel)) ? null : officetel,
        floorB: (r.floorB||"").toString().trim(),
        floorG: (r.floorG||"").toString().trim(),
        date: (r.date||"").toString().trim(),
        type,
        note: (r.note||"").toString().trim(),
        category: deriveCategory(type, name),
        region: deriveRegion(name),
      };
    });

  const saveBtn = document.getElementById('btn-save-edit');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }
  showToast('저장하는 중입니다. 잠시만 기다려주세요...');

  const candidate = {updatedAt: new Date().toISOString(), unit:'pyeong', rows: cleaned};
  const previous = baseline;
  baseline = candidate;
  const ok = await saveBaseline();

  if(ok){
    editMode = false;
    editUnlocked = false;
    editRows = null;
    showToast('기준파일이 저장되었습니다.');
    renderBaselineTab();
  }else{
    // 저장 실패 -> 이전 상태로 되돌리지 않고, 수정 내용을 그대로 유지해 재시도할 수 있게 함
    baseline = previous;
    showToast('저장에 실패했습니다. 네트워크를 확인한 뒤 저장을 다시 눌러주세요. (입력한 내용은 그대로 남아있어요)');
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = '저장'; }
  }
}

async function downloadBaseline(){
  showToast('엑셀 파일을 준비하는 중...');
  try{ await ensureXLSX(); }catch(e){ showToast('엑셀 기능을 불러오지 못했습니다. 네트워크를 확인해주세요.'); return; }
  const rows = baseline.rows;
  const data = rows.map(r=>({
    "사업단": r.division, "현장명": r.name, "블록/동 구분": r.block, "현장코드": r.code,
    "연면적(평)": r.area===null? "" : r.area,
    "세대수-아파트": r.apt===null? "" : r.apt,
    "세대수-오피스텔": r.officetel===null? "" : r.officetel,
    "지하층수": r.floorB, "지상층수": r.floorG, "준공일자": r.date, "건축물유형": r.category, "비고": r.note,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:14},{wch:38},{wch:9},{wch:11},{wch:12},{wch:10},{wch:11},{wch:8},{wch:8},{wch:11},{wch:10},{wch:40}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "기준파일");
  XLSX.writeFile(wb, "기준파일_공사현장현황.xlsx");
}

function handleUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  showToast('엑셀 파일을 읽는 중...');
  ensureXLSX().then(()=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {defval:""});
        const parsed = json.map(row=>{
          const dateVal = row["준공일자"];
          let dateStr = "";
          if(dateVal instanceof Date){
            dateStr = dateVal.toISOString().slice(0,10);
          } else if(dateVal){
            dateStr = String(dateVal).trim();
          }
          const type = row["건축물유형"]||"";
          const name = row["현장명"]||"";
          return {
            division: row["사업단"]||"",
            name: name,
            block: row["블록/동 구분"]||"",
            code: row["현장코드"]||"",
            area: row["연면적(평)"]===""||row["연면적(평)"]===undefined ? null : Number(row["연면적(평)"]),
            apt: row["세대수-아파트"]===""||row["세대수-아파트"]===undefined ? null : Number(row["세대수-아파트"]),
            officetel: row["세대수-오피스텔"]===""||row["세대수-오피스텔"]===undefined ? null : Number(row["세대수-오피스텔"]),
            floorB: row["지하층수"]? String(row["지하층수"]) : "",
            floorG: row["지상층수"]? String(row["지상층수"]) : "",
            date: dateStr,
            type: type,
            note: row["비고"]||"",
            category: deriveCategory(type, name),
            region: deriveRegion(name),
          };
        }).filter(r=>r.name);
        if(parsed.length === 0){
          showToast('읽어들인 현장이 0건입니다. 열 제목(현장명 등)이 다운로드한 기준파일과 같은지 확인해주세요. (교체가 진행되지 않아 기존 데이터는 안전합니다)');
          return;
        }
        pendingUpload = parsed;
        showUploadPreview(parsed);
      }catch(err){
        console.error(err);
        showToast('파일을 읽는 중 오류가 발생했습니다. 엑셀 형식을 확인해주세요.');
      }
    };
    reader.readAsArrayBuffer(file);
  }).catch(()=>{
    showToast('엑셀 기능을 불러오지 못했습니다. 네트워크를 확인해주세요.');
  });
  e.target.value = "";
}

function showUploadPreview(parsed){
  const box = document.getElementById('upload-preview');
  box.classList.add('show');
  box.innerHTML = `
    <div class="row">
      <div><b>${parsed.length}건</b>의 현장을 불러왔습니다. 반영 방법을 선택하세요.</div>
    </div>
    <div class="btns">
      <button class="btn primary" id="btn-merge">병합 적용 (같은 현장은 갱신, 새 현장은 추가)</button>
      <button class="btn danger" id="btn-replace">전체 교체 (기존 기준파일을 새 파일로 완전히 대체)</button>
      <button class="btn ghost" id="btn-cancel-upload">취소</button>
    </div>
  `;
  document.getElementById('btn-merge').addEventListener('click', ()=>applyUpload('merge'));
  document.getElementById('btn-replace').addEventListener('click', ()=>{
    if(confirm('기존 기준파일 데이터를 모두 삭제하고 새 파일로 교체합니다. 계속할까요?')) applyUpload('replace');
  });
  document.getElementById('btn-cancel-upload').addEventListener('click', ()=>{
    pendingUpload = null;
    document.getElementById('upload-preview').classList.remove('show');
  });
}

async function applyUpload(mode){
  if(!pendingUpload) return;
  const previous = baseline;
  let candidate;
  if(mode==='replace'){
    candidate = {updatedAt: new Date().toISOString(), unit:'pyeong', rows: pendingUpload};
  }else{
    const rows = baseline.rows.slice();
    pendingUpload.forEach(nr=>{
      const idx = rows.findIndex(r => (nr.code && r.code && r.code===nr.code) || (r.name===nr.name && r.block===nr.block));
      if(idx>=0) rows[idx] = nr; else rows.push(nr);
    });
    candidate = {updatedAt: new Date().toISOString(), unit:'pyeong', rows};
  }
  showToast('저장하는 중입니다. 잠시만 기다려주세요...');
  baseline = candidate;
  const ok = await saveBaseline();
  if(ok){
    pendingUpload = null;
    showToast('기준파일이 반영되었습니다.');
    renderBaselineTab();
  }else{
    baseline = previous;
    showToast('저장에 실패했습니다. 네트워크를 확인한 뒤 다시 시도해주세요.');
  }
}

  render();
})();

})();
